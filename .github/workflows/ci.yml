name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust workspace (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        # libgtk-3-dev / libwebkit2gtk-4.1-dev are real, environment-specific
        # build requirements found the first time this workspace was ever
        # compiled in a Linux container (§75.12) -- spartan-editor-core and
        # ui-shell-spike embed a real wry/WebView2 control that needs GTK's
        # headers to even link, not just run. cmake/build-essential/
        # libclang-dev are what llama-cpp-sys-2 (§75.83) needs to compile
        # its own vendored llama.cpp C++ source and generate FFI bindings
        # via bindgen -- confirmed already present without any explicit
        # install in this project's own development sandbox, but listed
        # here explicitly rather than relying on an unconfirmed assumption
        # about GitHub's own runner image contents.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            cmake \
            build-essential \
            libclang-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --release --all-targets

      - name: cargo test
        # --test-threads=1: this workspace's own real subprocess-spawning
        # test suites (LSP/DAP clients spawning real language
        # servers/debug adapters when present on PATH) can flake under
        # full parallelism from resource contention, not a functional bug
        # -- see CLAUDE.md's own "Build & test" section for the same note.
        # Tests requiring external tools not installed on this runner
        # (rust-analyzer, lldb-dap, debugpy, cargo-component, a live
        # Ollama instance) self-skip with a printed message rather than
        # failing, matching this project's own established convention.
        run: cargo test --workspace --release -- --test-threads=1

  desktop:
    name: desktop/ (Electron + React shell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json

      - name: npm ci
        working-directory: desktop
        run: npm ci

      - name: Typecheck
        working-directory: desktop
        run: npm run typecheck

      - name: Build renderer
        working-directory: desktop
        run: npm run build:renderer

      - name: Build electron main process
        working-directory: desktop
        run: npm run build:electron

  mobile:
    name: mobile/ (Expo/React Native IDE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: npm ci
        working-directory: mobile
        run: npm ci

      - name: Test
        working-directory: mobile
        run: npm test -- --ci

  web:
    name: web/ (vscode.dev-inspired browser IDE, §75.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-bindgen-cli
        # Must exactly match the `wasm-bindgen` crate version pinned in
        # Cargo.lock (0.2.126) -- a version mismatch between the CLI and
        # the crate is a real, documented wasm-bindgen failure mode.
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        working-directory: web
        run: npm ci

      - name: Build (compiles spartan-buffer-wasm, typechecks, bundles)
        working-directory: web
        run: npm run build

  tree-sitter-wasm-spike:
    name: spikes/tree-sitter-wasm-spike (web app prep, §75.86)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: spikes/tree-sitter-wasm-spike/package-lock.json

      - name: npm ci
        working-directory: spikes/tree-sitter-wasm-spike
        run: npm ci

      - name: Test
        working-directory: spikes/tree-sitter-wasm-spike
        run: npm test

  git-browser-spike:
    name: spikes/git-browser-spike (web app prep, §75.87)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: spikes/git-browser-spike/package-lock.json

      - name: npm ci
        working-directory: spikes/git-browser-spike
        run: npm ci

      - name: Test
        working-directory: spikes/git-browser-spike
        run: npm test

  cloud:
    name: cloud/ (Spartan Cloud domain crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          # cloud/ is its own separate Cargo workspace (not a root member),
          # so it has its own target dir -- key the cache to it.
          workspaces: cloud

      - name: cargo fmt --check
        working-directory: cloud
        run: cargo fmt --all -- --check

      - name: cargo clippy
        working-directory: cloud
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: cloud
        # --test-threads=1: the runtime crate's real-daemon tests share one
        # Docker daemon and the reaper's sweep is global (it stops every
        # managed container past its deadline), so a concurrent lifecycle test
        # and a reaper test can collide on teardown -- serialize them, matching
        # this repo's own convention for real-external-resource test suites.
        # GitHub's Linux runners provide a real Docker daemon, so these tests
        # run for real here rather than self-skipping.
        run: cargo test -- --test-threads=1
