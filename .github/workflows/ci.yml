name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel a superseded run when a new commit lands on the same ref. Without
# this, pushing three times in a row leaves three full runs competing for
# runners -- and, worse, a stale run's failure webhook is indistinguishable
# at a glance from the current head's, which genuinely caused a
# misdiagnosis during this workflow's own debugging.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust workspace (fmt, clippy, test)
    runs-on: ubuntu-latest
    # Real, explicit least-privilege: this job only ever checks out the repo,
    # builds, and runs tests -- it never pushes, comments, or touches any
    # GitHub API surface, so the default token's write access is dropped
    # entirely rather than left implicit.
    permissions:
      contents: read
    # An explicit timeout, deliberately generous. Several consecutive runs of
    # this job died mid-`cargo test`, at increasingly precise diagnoses: the
    # first three (before the per-step split below existed) died ~50-56
    # minutes in with the *entire job's* log unretrievable (BlobNotFound),
    # post-steps never run -- consistent with the runner itself dying, not a
    # graceful test failure, but only a hypothesis at the time. The per-step
    # split (see below) was pushed specifically to make a recurrence
    # diagnosable; the very next run confirmed it works (a real, fast,
    # fully-logged failure from an unrelated `-p`/`--` argument-order bug),
    # and the run *after that fix* died again -- this time with GitHub's own
    # real job-page annotation, not a guess: "The hosted runner lost
    # communication with the server. Anything in your workflow that
    # terminates the runner process, starves it for CPU/Memory, or blocks
    # its network access can cause this error," at 58m17s. That's a
    # GitHub-confirmed resource-exhaustion class of failure -- most likely
    # memory, since it consistently lands during real test *execution*
    # (docker/gradle/language-server/debug-adapter child processes,
    # sequential ~90s-class real `pyright-langserver` subprocess tests in
    # `spartan-lsp`/`spartan-backend`), not the heavier `--no-run` compile
    # step, which always completes cleanly first. Crucially: if the runner's
    # own agent process is itself OOM-killed, a per-step `timeout-minutes`
    # can't help -- that mechanism depends on the agent staying alive long
    # enough to notice and enforce it. `CARGO_BUILD_JOBS` below caps build-
    # time parallelism (real memory pressure from compiling several heavy
    # crates -- wasmtime, llama-cpp-sys-2's vendored C++ -- concurrently);
    # a `free -h` after every group (not just once, previously) is the real,
    # additional diagnostic this pass adds so a further recurrence pinpoints
    # exactly which group's memory was already critical beforehand, closing
    # the remaining gap between "confirmed resource exhaustion" and "known
    # exactly where."
    timeout-minutes: 120
    env:
      # A conservative, explicit cap rather than trusting cargo's own
      # nproc-based default, which can pick a build parallelism higher than
      # the runner's real memory can support when several heavy crates
      # (wasmtime, llama-cpp-sys-2's vendored llama.cpp C++) compile at
      # once -- exactly the kind of build-time memory spike GitHub's own
      # "starves it for CPU/Memory" annotation names as a real cause class.
      CARGO_BUILD_JOBS: "4"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Free up runner disk space
        # `cargo test --workspace --release` codegens ~80 test binaries,
        # including llama-cpp-sys-2's vendored llama.cpp C++, wasmtime, and
        # wry -- a genuinely large release target/ directory on a runner
        # that ships with only ~14 GB free. Disk exhaustion is the leading
        # hypothesis for the runner deaths described above, so this removes
        # preinstalled toolchains this workspace never uses. The `df -h`
        # lines are the point as much as the deletion is: they make the
        # next run *measure* whether disk is actually the constraint,
        # rather than leaving it a hypothesis.
        run: |
          echo "=== disk before cleanup ==="
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          echo "=== disk after cleanup ==="
          df -h /

      - name: Install system dependencies
        # libgtk-3-dev / libwebkit2gtk-4.1-dev are real, environment-specific
        # build requirements found the first time this workspace was ever
        # compiled in a Linux container (§75.12) -- spartan-editor-core and
        # ui-shell-spike embed a real wry/WebView2 control that needs GTK's
        # headers to even link, not just run. cmake/build-essential/
        # libclang-dev are what llama-cpp-sys-2 (§75.83) needs to compile
        # its own vendored llama.cpp C++ source and generate FFI bindings
        # via bindgen -- confirmed already present without any explicit
        # install in this project's own development sandbox, but listed
        # here explicitly rather than relying on an unconfirmed assumption
        # about GitHub's own runner image contents.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            cmake \
            build-essential \
            libclang-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --release --all-targets

      - name: cargo test --no-run (build test binaries)
        # Split out from the run step on purpose. When this job died, the
        # single combined `cargo test` step gave no way to tell whether the
        # ~50 minutes went into release codegen or into actually executing
        # tests. Separating them attributes the cost in the log.
        #
        # A real, explicit per-step bound, matching every test-execution
        # group below rather than leaving this the one unbounded step in
        # the job -- generous (this is the single heaviest step, compiling
        # ~80 test binaries including wasmtime/llama-cpp-sys-2's vendored
        # C++/wry) but still a real safety net if release codegen itself
        # ever wedges, not just the test-execution groups this file already
        # bounds.
        timeout-minutes: 45
        run: cargo test --workspace --release --no-run

      - name: Report disk and memory usage after building test binaries
        # `free -h` alongside the existing `df -h` -- this workspace has
        # never once measured real RAM headroom on this runner, only disk.
        # If the actual cause of the runner deaths described above is
        # memory exhaustion (a real, plausible read given the death
        # consistently happens during test *execution*, not the heavier
        # compile step, and this runner's real subprocess load only grows
        # once execution starts -- real docker/gradle/language-server/
        # debug-adapter child processes, when present), this is the first
        # run that will actually show it.
        run: |
          df -h /
          du -sh target 2>/dev/null || true
          free -h

      # The single combined `cargo test --workspace` step below (now
      # removed) is exactly what died three times with a totally
      # unretrievable log. Split into several smaller, sequential,
      # per-step-timeout-bounded groups instead -- reusing the exact same
      # already-built binaries from the `--no-run` step above, so this
      # adds no extra compile time. Two real, distinct benefits over one
      # monolithic step: (1) a per-step `timeout-minutes` here is enforced
      # by the runner's own job-control, not GitHub's outer job-level
      # mechanism -- if a group genuinely hangs, *that* group's process is
      # killed while the runner keeps running normally, which should
      # finally produce a real, retrievable log instead of another
      # BlobNotFound; (2) even without a timeout firing, whichever named
      # step never shows as completed next time narrows a ~50-minute
      # blind spot down to a specific slice of the workspace. Every group
      # still uses --test-threads=1 for the same real subprocess-
      # contention reason the single step already documented; tests
      # requiring an external tool not installed on this runner
      # (rust-analyzer, pyright-langserver, lldb-dap, debugpy,
      # cargo-component, LM Studio/litellm/a live Ollama instance, a real
      # Android SDK) self-skip with a printed message, matching this
      # project's own established convention.
      - name: cargo test -- foundation crates (buffer/languages/security/crash/settings/updater/model/xtask, fast spikes)
        timeout-minutes: 15
        run: |
          cargo test --release \
            -p spartan-buffer -p spartan-buffer-wasm -p spartan-languages \
            -p spartan-security -p spartan-crash -p spartan-settings \
            -p spartan-updater -p spartan-model -p xtask \
            -p rope-spike -p fallback-parser-spike -p wasm-buffer-spike \
            -- --test-threads=1

      - name: Report memory after foundation-crates group
        if: always()
        run: free -h

      - name: cargo test -- git + leo
        timeout-minutes: 15
        run: cargo test --release -p spartan-git -p spartan-leo -- --test-threads=1

      - name: Report memory after git+leo group
        if: always()
        run: free -h

      - name: cargo test -- lsp + dap clients (real subprocess-spawning, self-skip if tools absent)
        timeout-minutes: 20
        run: |
          cargo test --release \
            -p spartan-lsp -p spartan-dap -p lsp-spike -p dap-spike \
            -- --test-threads=1

      - name: Report memory after lsp+dap group
        if: always()
        run: free -h

      - name: cargo test -- devcontainer + android + plugin-host (real Docker/Gradle/cargo-component)
        timeout-minutes: 20
        run: |
          cargo test --release \
            -p spartan-devcontainer -p spartan-android -p spartan-plugin-host \
            -- --test-threads=1

      - name: Report memory after devcontainer+android+plugin-host group
        if: always()
        run: free -h

      - name: cargo test -- spartan-backend (largest single crate, most integration tests)
        timeout-minutes: 25
        run: cargo test --release -p spartan-backend -- --test-threads=1

      - name: Report memory after spartan-backend group
        if: always()
        run: free -h

      - name: cargo test -- editor-core + remaining GPU/display spikes + devserver
        timeout-minutes: 15
        run: |
          cargo test --release \
            -p spartan-editor-core -p render-spike -p ui-shell-spike -p spartan-devserver \
            -- --test-threads=1

      - name: Report memory usage after all test groups
        if: always()
        run: free -h

  desktop:
    name: desktop/ (Electron + React shell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json

      - name: npm ci
        working-directory: desktop
        run: npm ci

      - name: Typecheck
        working-directory: desktop
        run: npm run typecheck

      - name: Build renderer
        working-directory: desktop
        run: npm run build:renderer

      - name: Build electron main process
        working-directory: desktop
        run: npm run build:electron

  mobile:
    name: mobile/ (Expo/React Native IDE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: npm ci
        working-directory: mobile
        run: npm ci

      - name: Test
        working-directory: mobile
        run: npm test -- --ci

  web:
    name: web/ (vscode.dev-inspired browser IDE, §75.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-bindgen-cli
        # Must exactly match the `wasm-bindgen` crate version pinned in
        # Cargo.lock (0.2.126) -- a version mismatch between the CLI and
        # the crate is a real, documented wasm-bindgen failure mode.
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        working-directory: web
        run: npm ci

      - name: Build (compiles spartan-buffer-wasm, typechecks, bundles)
        working-directory: web
        run: npm run build

  tree-sitter-wasm-spike:
    name: spikes/tree-sitter-wasm-spike (web app prep, §75.86)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: spikes/tree-sitter-wasm-spike/package-lock.json

      - name: npm ci
        working-directory: spikes/tree-sitter-wasm-spike
        run: npm ci

      - name: Test
        working-directory: spikes/tree-sitter-wasm-spike
        run: npm test

  git-browser-spike:
    name: spikes/git-browser-spike (web app prep, §75.87)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: spikes/git-browser-spike/package-lock.json

      - name: npm ci
        working-directory: spikes/git-browser-spike
        run: npm ci

      - name: Test
        working-directory: spikes/git-browser-spike
        run: npm test

  cloud:
    name: cloud/ (Spartan Cloud domain crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          # cloud/ is its own separate Cargo workspace (not a root member),
          # so it has its own target dir -- key the cache to it.
          workspaces: cloud

      - name: cargo fmt --check
        working-directory: cloud
        run: cargo fmt --all -- --check

      - name: cargo clippy
        working-directory: cloud
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: cloud
        # --test-threads=1: the runtime crate's real-daemon tests share one
        # Docker daemon and the reaper's sweep is global (it stops every
        # managed container past its deadline), so a concurrent lifecycle test
        # and a reaper test can collide on teardown -- serialize them, matching
        # this repo's own convention for real-external-resource test suites.
        # GitHub's Linux runners provide a real Docker daemon, so these tests
        # run for real here rather than self-skipping.
        run: cargo test -- --test-threads=1
