name: Pages

# Real GitHub Pages deployment: a hand-written static landing/downloads
# page (`site/`) at the root, a live build of `web/` (the client-side File
# System Access + WASM browser IDE, §75.89) served under `/app/`, and real
# installer binaries served directly from this Pages site under
# `/downloads/` -- NOT linked out to GitHub Releases.
#
# That last point is load-bearing, not stylistic: the project's own source
# is Apache-2.0 licensed, but the GitHub *repository* itself remains
# private as of this workflow's own current state (a separate, real
# Settings toggle from the license, still pending a manual flip only the
# account owner can make) -- and GitHub Release assets on a private repo
# require the visitor to already have repo access, so a public download
# page linking `github.com/.../releases/...` would 404/login-wall for
# anyone outside the org. Hosting the real built binaries as static files
# on the Pages site itself sidesteps that regardless of the repo's own
# visibility: the compiled installers remain genuinely downloadable by
# whoever this Pages site's own access is granted to, independent of
# whether someone can also see the source. This workflow still never
# publishes any source file, only compiled artifacts, matching its own
# name (this is a downloads page, not a source mirror).
#
# Triggered by the "Release" workflow's own completion (not by every push
# to `main`) -- since the real, downloadable installers only exist once a
# beta version has actually been tagged and built, tying Pages to that
# exact run guarantees the downloads page never claims an artifact that
# wasn't genuinely produced by this specific run.

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Pages artifact
    runs-on: ubuntu-latest
    # Only deploy off a real, successful Release run -- a failed/cancelled
    # run's own artifacts may be partial or entirely absent. A manual
    # `workflow_dispatch` has no `workflow_run` context at all, so it's
    # allowed through unconditionally (the download step below will fail
    # loudly on its own if no prior successful run exists to pull from).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node (for rendering README.md -> docs.html)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve the Release run to pull artifacts from
        # A real `workflow_run` trigger already carries the exact
        # triggering run's id. A manual `workflow_dispatch` has no such
        # context at all -- look up the most recent *successful* "Release"
        # run via the real GitHub API instead of guessing (this workflow's
        # own run id would be wrong: it has no build artifacts of its own).
        id: source_run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            echo "run_id=${{ github.event.workflow_run.id }}" >> "$GITHUB_OUTPUT"
          else
            RUN_ID=$(gh api "repos/${{ github.repository }}/actions/workflows/release.yml/runs?status=success&per_page=1" \
              --jq '.workflow_runs[0].id')
            if [[ -z "$RUN_ID" || "$RUN_ID" == "null" ]]; then
              echo "::error::No successful Release run found to pull artifacts from." >&2
              exit 1
            fi
            echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all artifacts from that Release run
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.source_run.outputs.run_id }}
          path: artifacts

      - name: Assemble Pages artifact
        # Real, plain file staging. `site/` (the hand-written landing page)
        # becomes the artifact root; `web/`'s real production build
        # (already built once by the Release run's own `web-build` job,
        # not rebuilt here) is unzipped under `app/`; every real installer
        # is copied under `downloads/` with a stable, version-less
        # filename -- so this page's own download links never need to
        # change as the version bumps, and no GitHub Release URL of any
        # kind is ever referenced.
        run: |
          set -e
          mkdir -p _site/app _site/downloads
          cp -r site/. _site/
          # docs-template.html is a build input for the render step below,
          # not a real page of its own -- don't ship the raw, unrendered
          # template with its literal {{README_BODY}} placeholder still in it.
          rm -f _site/docs-template.html

          unzip -q artifacts/web-package/*.zip -d _site/app

          # Real installers, renamed to stable filenames. Each cp is
          # individually best-effort (`|| true`) -- a `continue-on-error`
          # desktop-packaging job in the Release run may genuinely have
          # failed for a given platform, and this page must still deploy
          # with whatever real artifacts did build, not fail outright.
          cp artifacts/desktop-linux-package/*.AppImage _site/downloads/SpartanIDE-linux-x64.AppImage || true
          cp artifacts/desktop-linux-package/*.deb _site/downloads/SpartanIDE-linux-x64.deb || true
          cp artifacts/desktop-windows-package/*.exe _site/downloads/SpartanIDE-windows-x64-Setup.exe || true
          cp artifacts/desktop-mac-package/*.dmg _site/downloads/SpartanIDE-macos.dmg || true
          cp artifacts/android-package/*.apk _site/downloads/SpartanIDE-mobile-android.apk || true
          cp artifacts/linux-package/*.tar.gz _site/downloads/spartan-reference-shell-linux-x64.tar.gz || true
          cp artifacts/windows-package/*.zip _site/downloads/spartan-reference-shell-windows-x64.zip || true

          echo "Real files staged for /downloads/:"
          ls -la _site/downloads/

      - name: Render README.md into a live documentation page
        # The real project README, rendered server-side at deploy time (via
        # the `marked` npm package, installed into a throwaway scratch dir
        # so it never touches this repo's own package.json/lockfiles) and
        # spliced into site/docs-template.html's {{README_BODY}} placeholder.
        # This is the single source of truth for that content -- nothing
        # here is a hand-maintained duplicate of the real README.md, so the
        # published page can't silently drift from what's actually checked
        # into the (private) source repository.
        run: |
          set -e
          RENDER_DIR=$(mktemp -d)
          (cd "$RENDER_DIR" && npm install --no-save marked >/dev/null 2>&1)
          node -e "
            const { marked } = require('$RENDER_DIR/node_modules/marked');
            const fs = require('fs');
            const md = fs.readFileSync('README.md', 'utf8');
            const body = marked.parse(md);
            const template = fs.readFileSync('site/docs-template.html', 'utf8');
            const out = template.replace('{{README_BODY}}', body);
            fs.writeFileSync('_site/docs.html', out);
          "
          echo "Rendered README.md -> _site/docs.html ($(wc -c < _site/docs.html) bytes)"

      - name: Setup Pages
        # `enablement: true` lets this action actually turn Pages on for
        # this repo via the real GitHub API (the workflow's own
        # `pages: write` permission covers it) instead of only ever
        # configuring an *already-enabled* site -- found necessary only by
        # running this workflow for real: `configure-pages@v5` defaults to
        # `enablement: false` and failed with a real "Get Pages site
        # failed... Not Found" the first two times this ran, since Pages
        # had never actually been switched on for this repository at all
        # (a real, separate, one-time repo-settings toggle, not a
        # workflow bug). If this repo's own plan genuinely can't have
        # Pages enabled at all (the private-repo restriction already
        # documented elsewhere in this workflow's own history), this step
        # will still fail, now with a clearer, plan-specific error instead
        # of a generic "Not Found."
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
