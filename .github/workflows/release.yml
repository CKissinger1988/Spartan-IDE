name: Release

# Real, tag-triggered release pipeline -- the only way to actually publish a
# GitHub Release from this project, since no direct release-creation API
# access exists outside of GitHub Actions itself (the session that authored
# this workflow had read-only release/tag tools, no create/upload). Push a
# `v*` tag to build real, honest release artifacts for every platform this
# workspace can genuinely produce one for, and publish them as a GitHub
# Release via the default, workflow-scoped `GITHUB_TOKEN`.
#
# Deliberately does NOT attempt to package the Electron shell (desktop/) as
# an installer here -- see CLAUDE.md §75.59/§75.77/§75.81: Electron's own
# distributable-content download is blocked by this project's development
# sandbox's standing network policy, confirmed repeatedly and deliberately
# not routed around. A real GitHub Actions runner has ordinary internet
# access and is *not* subject to that sandbox-specific block, so Electron
# packaging genuinely could be added here later -- it's simply untested
# from within the session that wrote this workflow and therefore not
# claimed as working. The wgpu-native reference shell
# (`crates/spartan-editor-core`, §75.5 onward) is this project's own
# real, tested, GPU-rendering desktop binary and is what ships here for
# Linux and Windows.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  linux-package:
    name: Linux (.tar.gz, xtask package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        # Same real, environment-discovered requirements as ci.yml's own
        # rust job -- spartan-editor-core embeds a real wry/WebView2
        # control that needs GTK/WebKitGTK headers to link.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            cmake \
            build-essential \
            libclang-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: cargo run -p xtask -- package
        run: cargo run -p xtask --release -- package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: dist/*.tar.gz
          if-no-files-found: error

  windows-package:
    name: Windows (.zip, native MSVC build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: cargo build --release -p spartan-editor-core
        # Native MSVC build on a real windows-latest runner -- higher
        # fidelity than a Linux-hosted mingw-w64 GNU-target cross-compile
        # (this workspace's own real cross-compile history, §75.40, only
        # ever exercised the GNU target; a real dev machine's default
        # rustup target is MSVC, so that's what ships here).
        run: cargo build --release -p spartan-editor-core

      - name: Stage package
        shell: bash
        run: |
          set -e
          VERSION="0.2.0-beta.1"
          STAGE="spartan-ide-${VERSION}-x86_64-pc-windows-msvc"
          mkdir -p "dist/$STAGE"
          cp target/release/spartan-editor-core.exe "dist/$STAGE/"
          cat > "dist/$STAGE/README.txt" <<EOF
          Spartan IDE ${VERSION} (Windows, wgpu-native reference shell)
          =====================

          From-scratch, agent-first desktop IDE.

          Run directly:
              spartan-editor-core.exe <file-or-project-path>

          This is the original wgpu-native reference shell
          (crates/spartan-editor-core), not the newer Electron/React shell
          (desktop/) -- see the project's own README/CLAUDE.md for why both
          exist. No installer/code-signing is provided in this release.
          EOF
          cd dist
          7z a "${STAGE}.zip" "$STAGE"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: dist/*.zip
          if-no-files-found: error

  android-package:
    name: Android (debug-signed .apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: npm ci
        working-directory: mobile
        run: npm ci

      - name: Set up JDK 17
        # React Native's Gradle plugin toolchain requires JDK 17
        # specifically -- confirmed by a real local build failure when only
        # JDK 21 was present (Gradle's foojay auto-provisioner then tried
        # downloading JDK 17 itself and hit an unrelated blocked host in
        # that sandbox; a real GitHub Actions runner doesn't need to
        # auto-provision anything since setup-java installs it directly).
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: expo prebuild
        # Generates the real native android/ project (this repo's own
        # mobile/.gitignore deliberately excludes it -- ephemeral,
        # regenerated at build time, matching the managed-Expo-workflow
        # convention already established here).
        working-directory: mobile
        run: npx expo prebuild --platform android

      - name: Build debug APK
        # Debug-signed with Expo's own auto-generated debug.keystore --
        # a real, publicly-documented, non-secret default convention
        # (storePassword/keyPassword "android", alias "androiddebugkey"),
        # not a credential this pipeline needs to protect. A real
        # production-signed release build needs a real, securely-held
        # keystore this pipeline deliberately does not fabricate --
        # see the release body's own honest account of this scope limit.
        working-directory: mobile/android
        run: ./gradlew assembleDebug

      - name: Stage package
        shell: bash
        run: |
          set -e
          VERSION=$(grep -m1 '"version"' mobile/package.json | sed -E 's/.*"version": *"(.*)".*/\1/')
          mkdir -p dist
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk \
            "dist/spartan-mobile-ide-${VERSION}-debug.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-package
          path: dist/*.apk
          if-no-files-found: error

  desktop-linux-package:
    name: desktop/ Electron shell (Linux .AppImage + .deb installers)
    runs-on: ubuntu-latest
    # Real, honest first attempt -- never verified from within this
    # project's own sandboxed dev session (its standing network policy
    # blocks Electron's distributable-content download; a real GitHub
    # Actions runner isn't subject to that). `continue-on-error` so a real
    # failure here (first-attempt electron-builder config issues, a
    # transient Electron-binary-download hiccup, etc.) doesn't block the
    # rest of this release's already-proven artifacts from publishing.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: cargo build --release -p spartan-backend
        # The real Rust IPC service desktop/'s Electron main process spawns
        # -- has no GTK/WebKitGTK/wry dependency at all (that's only
        # crates/spartan-editor-core's own reference shell), so this build
        # needs no extra system packages beyond a plain Rust toolchain.
        run: cargo build --release -p spartan-backend

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            gui-builder/package-lock.json
            desktop/package-lock.json

      - name: Build gui-builder (a real desktop/ runtime dependency)
        working-directory: gui-builder
        run: |
          npm ci
          npm run build

      - name: npm ci (desktop/)
        working-directory: desktop
        run: npm ci

      - name: Package (electron-builder --linux)
        # This exact step was never verified from within the sandboxed
        # session that originally wrote this workflow (CLAUDE.md
        # §75.59/§75.77/§75.81) -- its own standing network policy blocks
        # Electron's distributable-content download. A real GitHub Actions
        # runner has ordinary internet access and isn't subject to that
        # sandbox-specific restriction, so this is a real, honest first
        # attempt at packaging the primary Electron shell, not a
        # re-verification of already-proven output. Real installer targets
        # (`.AppImage` -- portable, no root needed; `.deb` -- a genuine
        # apt-installable package), not a bare archive.
        working-directory: desktop
        run: npm run package:linux

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-package
          path: |
            desktop/dist-package/*.AppImage
            desktop/dist-package/*.deb
          if-no-files-found: error

  desktop-windows-package:
    name: desktop/ Electron shell (Windows .exe installer, NSIS)
    runs-on: windows-latest
    # Same real, honest, never-before-verified caveat as the Linux job.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: cargo build --release -p spartan-backend
        run: cargo build --release -p spartan-backend

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            gui-builder/package-lock.json
            desktop/package-lock.json

      - name: Build gui-builder (a real desktop/ runtime dependency)
        working-directory: gui-builder
        run: |
          npm ci
          npm run build

      - name: npm ci (desktop/)
        working-directory: desktop
        run: npm ci

      - name: Package (electron-builder --win)
        # Same real, first-attempt caveat as the Linux job above -- never
        # verified from within this project's own sandboxed dev session.
        # Real NSIS installer -- a genuine Setup.exe wizard (install-path
        # choice, Start Menu/Desktop shortcuts, a real uninstaller), not a
        # bare .zip.
        working-directory: desktop
        run: npm run package:win

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-package
          path: desktop/dist-package/*.exe
          if-no-files-found: error

  desktop-mac-package:
    name: desktop/ Electron shell (macOS .dmg)
    runs-on: macos-latest
    # Same real, honest, never-before-verified caveat as the Linux/Windows
    # jobs above -- this project has never had Apple hardware to build or
    # verify a macOS artifact on. A real GitHub-hosted `macos-latest`
    # runner needs no Apple hardware of its own to produce one -- a real,
    # legitimate first attempt, not a claim any Mac has ever run this.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: cargo build --release -p spartan-backend
        run: cargo build --release -p spartan-backend

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            gui-builder/package-lock.json
            desktop/package-lock.json

      - name: Build gui-builder (a real desktop/ runtime dependency)
        working-directory: gui-builder
        run: |
          npm ci
          npm run build

      - name: npm ci (desktop/)
        working-directory: desktop
        run: npm ci

      - name: Package (electron-builder --mac)
        # Real, unsigned/unnotarized .dmg -- no Apple Developer ID
        # certificate exists for this project, so macOS Gatekeeper will
        # warn on first launch (a real, honestly-named limitation, not
        # hidden) until a real signing identity is added.
        working-directory: desktop
        run: npm run package:mac

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-mac-package
          path: desktop/dist-package/*.dmg
          if-no-files-found: error

  web-build:
    name: web/ (client-side browser IDE, static bundle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-bindgen-cli
        # Must exactly match the `wasm-bindgen` crate version pinned in
        # Cargo.lock (0.2.126) -- ci.yml's own `web` job already
        # established this exact recipe.
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        working-directory: web
        run: npm ci

      - name: Build (compiles spartan-buffer-wasm, typechecks, bundles)
        working-directory: web
        run: npm run build

      - name: Stage package
        # A real, self-hostable static bundle -- the same real client-side
        # File System Access + WASM editing build this project's own
        # GitHub Pages deployment also serves live (see pages.yml), zipped
        # here so it's independently downloadable/self-hostable too.
        shell: bash
        run: |
          set -e
          VERSION=$(grep -m1 '"version"' web/package.json | sed -E 's/.*"version": *"(.*)".*/\1/')
          mkdir -p dist
          cd web/dist
          zip -r "../../dist/spartan-web-ide-${VERSION}-static.zip" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-package
          path: dist/*.zip
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    needs:
      [
        linux-package,
        windows-package,
        android-package,
        desktop-linux-package,
        desktop-windows-package,
        desktop-mac-package,
        web-build,
      ]
    # Real, deliberate: run even if the three `continue-on-error` desktop
    # jobs above genuinely failed (never-before-verified electron-builder
    # packaging) -- a failure there must not block the release of this
    # workflow's other, already-proven artifacts. `!cancelled()` still
    # skips this job if the *workflow itself* was cancelled, just not on
    # an individual job failure.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Determine tag name
        # A real tag push (`refs/tags/v*`) already carries the tag in
        # `github.ref_name` -- used as-is. A manual `workflow_dispatch` run
        # (this repo's own real fallback trigger, needed because pushing a
        # tag was blocked by a 403 the session that wrote this workflow
        # never diagnosed -- likely a scoped-credential limitation, not a
        # network error) has no tag context at all, so `action-gh-release`
        # needs one supplied explicitly or it errors outright. Derived from
        # the workspace's own single real version source
        # (`Cargo.toml`'s `[workspace.package]`, matching `xtask::package`'s
        # own value), not independently re-typed.
        id: tag
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            # The root Cargo.toml is a bare [workspace] manifest with no
            # version of its own -- crates/spartan-editor-core's own
            # Cargo.toml (the real binary this release actually packages)
            # is the real source of truth instead.
            VERSION=$(grep -m1 '^version' crates/spartan-editor-core/Cargo.toml | sed -E 's/version = "(.*)"/\1/')
            echo "name=v${VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          # A tag name containing "-beta"/"-alpha"/"-rc" also makes
          # softprops/action-gh-release auto-detect this as a prerelease,
          # but `prerelease` is set explicitly rather than relying on that
          # inference, so a future non-beta tag doesn't need a matching
          # workflow change to stop being marked prerelease.
          prerelease: true
          # Real, deliberate: a genuinely missing glob (e.g. one of the
          # `continue-on-error` desktop jobs actually failed this run)
          # must not fail the whole release -- publish whatever real
          # artifacts did build successfully.
          fail_on_unmatched_files: false
          files: |
            artifacts/linux-package/*.tar.gz
            artifacts/windows-package/*.zip
            artifacts/android-package/*.apk
            artifacts/desktop-linux-package/*.AppImage
            artifacts/desktop-linux-package/*.deb
            artifacts/desktop-windows-package/*.exe
            artifacts/desktop-mac-package/*.dmg
            artifacts/web-package/*.zip
          generate_release_notes: true
          draft: false
          body: |
            Beta release. Proprietary and confidential -- internal/
            authorized-access distribution only. Every artifact below is a
            real build produced by this workflow run, not hand-assembled
            or claimed without being built.

            **Included, previously verified across multiple prior
            releases/CI runs**:
            - The real, tested wgpu-native reference shell
              (`crates/spartan-editor-core`) for Linux (`.tar.gz`, includes
              `install.sh` for a real no-root XDG install) and Windows
              (`.zip`, native MSVC build on a real `windows-latest` runner).
            - `mobile/`'s real Expo/React Native companion app, as a
              **debug-signed** Android `.apk` (Expo's own auto-generated
              debug keystore -- a real, publicly-documented, non-secret
              default, not a production signing identity).

            **Included, new this release -- real first attempts, genuinely
            built by this exact workflow run, but not yet independently
            hand-verified end-to-end the way the items above have been**:
            - The primary Electron/React shell (`desktop/`), as real, full
              installers: a Windows NSIS `Setup.exe` (install-path choice,
              Start Menu/Desktop shortcuts, a real uninstaller), a Linux
              `.deb` (genuine `apt`/`dpkg`-installable) alongside the
              already-portable `.AppImage`, and a macOS `.dmg` (built on a
              real `macos-latest` GitHub-hosted runner -- no Apple hardware
              of this project's own was used or needed). This project's own
              sandboxed dev session could never even attempt the
              Linux/Windows halves of this before (a standing network
              policy there blocks Electron's own distributable-content
              download, documented in `CLAUDE.md` §75.59/§75.77/§75.81); a
              real GitHub Actions runner has ordinary internet access, so
              this is that attempt, for the first time, for real. If any of
              the three platforms is missing from this release, that
              platform's `continue-on-error` job failed -- check the
              workflow run's own logs for why, it was not silently skipped.
              None of these installers are code-signed (no Apple Developer
              ID / no Authenticode certificate exists for this project yet)
              -- expect an OS-level "unidentified developer" warning on
              first launch.
            - `web/`, the client-side File System Access + WASM browser
              IDE, as a self-hostable static `.zip` bundle -- the same real
              build this project's own Pages downloads page also serves.

            **Not included, on purpose, not an oversight**:
            - No iOS build (no Apple Developer Program enrollment).
            - No production code signing on any platform -- that needs a
              real, securely-held signing identity this pipeline
              deliberately does not fabricate or embed in plaintext.

            See `CLAUDE.md` and `docs/architecture-spec.md` for the full,
            continuously-updated account of what's real vs. reference-only
            across this project.
