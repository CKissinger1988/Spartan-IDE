[package]
name = "spartan-backend"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
spartan-buffer = { path = "../spartan-buffer" }
spartan-leo = { path = "../spartan-leo" }
spartan-model = { path = "../spartan-model" }
spartan-git = { path = "../spartan-git" }
spartan-settings = { path = "../spartan-settings" }
spartan-updater = { path = "../spartan-updater" }
spartan-devcontainer = { path = "../spartan-devcontainer" }
spartan-android = { path = "../spartan-android" }
spartan-crash = { path = "../spartan-crash" }
spartan-lsp = { path = "../spartan-lsp" }
spartan-dap = { path = "../spartan-dap" }
spartan-languages = { path = "../spartan-languages" }
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9.0"
similar = "3.1.1"
tungstenite = "0.30"
rand = "0.10"
# Sync HTTP client for polling a spawned LiteLLM proxy's own health
# endpoint (moved here from spartan-devserver along with litellm_proxy.rs/
# hf_downloader.rs/lmstudio_downloader.rs/subprocess.rs so desktop/'s
# Electron shell -- which spawns a plain spartan-backend, not
# spartan-devserver -- gets the same real model-management methods
# web/ already has). The same crate spartan-model's providers already use.
ureq = "2"
