[package]
name = "spartan-buffer-wasm"
version = "0.1.0"
edition = "2021"
description = "Real wasm-bindgen wrapper around spartan-buffer::Document, promoted from spikes/wasm-buffer-spike (§75.85) for its first real consumer: web/'s client-side editing core (§75.89, task #81)."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
spartan-buffer = { path = "../spartan-buffer" }
wasm-bindgen = "0.2"
