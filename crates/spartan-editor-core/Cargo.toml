[package]
name = "spartan-editor-core"
version = "0.2.0-beta.1"
edition = "2021"
license.workspace = true

[dependencies]
spartan-buffer = { path = "../spartan-buffer" }
spartan-languages = { path = "../spartan-languages" }
spartan-git = { path = "../spartan-git" }
spartan-security = { path = "../spartan-security" }
spartan-crash = { path = "../spartan-crash" }
spartan-model = { path = "../spartan-model" }
spartan-leo = { path = "../spartan-leo" }
spartan-settings = { path = "../spartan-settings" }
spartan-updater = { path = "../spartan-updater" }
wgpu = "0.19"
winit = "0.29"
glyphon = "0.5"
sys-locale = "0.3"
ttf-parser = "0.19"
pollster = "0.3"
bytemuck = { version = "1", features = ["derive"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-highlight = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.25"
tree-sitter-java = "0.23"
tree-sitter-go = "0.25"
arboard = "3"
tree-sitter-javascript = "0.25.0"
accesskit_winit = "0.19"
accesskit = "0.13"
wry = "0.43"
raw-window-handle = "0.6"
windows = { version = "0.56", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse"] }
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-c-sharp = "0.23"
portable-pty = "0.9.0"

# Real GTK init/event-loop-pump requirement (§6.1, task #12): wry's own
# WebKitGTK backend needs `gtk::init()` called and `gtk::main_iteration_do`
# pumped every frame on Linux/BSD, matching exactly the platform set wry's
# own Cargo.toml gates its GTK dependencies behind.
[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd"))'.dependencies]
gtk = "0.18"

[dev-dependencies]
