[package]
name = "spartan-editor-core"
version = "0.1.0"
edition = "2021"

[dependencies]
spartan-buffer = { path = "../spartan-buffer" }
spartan-languages = { path = "../spartan-languages" }
spartan-git = { path = "../spartan-git" }
wgpu = "0.19"
winit = "0.29"
glyphon = "0.5"
pollster = "0.3"
bytemuck = { version = "1", features = ["derive"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-highlight = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.25"
tree-sitter-java = "0.23"
tree-sitter-go = "0.25"
arboard = "3"
tree-sitter-javascript = "0.25.0"

[dev-dependencies]
