[package]
name = "spartan-editor-core"
version = "0.2.0-beta.4"
edition = "2021"
license.workspace = true

[dependencies]
spartan-buffer = { path = "../spartan-buffer" }
spartan-languages = { path = "../spartan-languages" }
spartan-git = { path = "../spartan-git" }
spartan-security = { path = "../spartan-security" }
spartan-crash = { path = "../spartan-crash" }
spartan-model = { path = "../spartan-model" }
spartan-leo = { path = "../spartan-leo" }
spartan-settings = { path = "../spartan-settings" }
spartan-updater = { path = "../spartan-updater" }
wgpu = "0.19"
winit = "0.29"
glyphon = "0.5"
sys-locale = "0.3"
ttf-parser = "0.19"
pollster = "0.3"
bytemuck = { version = "1", features = ["derive"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-highlight = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.25"
tree-sitter-java = "0.23"
tree-sitter-go = "0.25"
arboard = "3"
tree-sitter-javascript = "0.25.0"
accesskit_winit = "0.19"
accesskit = "0.13"
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-c-sharp = "0.23"
portable-pty = "0.9.0"

[dev-dependencies]
