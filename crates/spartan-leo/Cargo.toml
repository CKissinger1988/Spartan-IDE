[package]
name = "spartan-leo"
version = "0.1.0"
edition = "2021"

[dependencies]
spartan-model = { path = "../spartan-model" }
spartan-git = { path = "../spartan-git" }
spartan-security = { path = "../spartan-security" }
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
