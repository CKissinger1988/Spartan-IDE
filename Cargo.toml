[workspace]
resolver = "2"
members = [
    "spikes/rope-spike",
    "spikes/fallback-parser-spike",
    "spikes/dap-spike",
    "spikes/lsp-spike",
    "spikes/render-spike",
    "spikes/ui-shell-spike",
    "spikes/wasm-buffer-spike",
    "crates/spartan-buffer",
    "crates/spartan-buffer-wasm",
    "crates/spartan-languages",
    "crates/spartan-git",
    "crates/spartan-security",
    "crates/spartan-crash",
    "crates/spartan-plugin-host",
    "crates/spartan-model",
    "crates/spartan-leo",
    "crates/spartan-settings",
    "crates/spartan-updater",
    "crates/spartan-devcontainer",
    "crates/spartan-android",
    "crates/spartan-editor-core",
    "crates/spartan-backend",
    "crates/spartan-devserver",
    "crates/spartan-lsp",
    "crates/spartan-dap",
    "xtask",
]

# `crates/plugins/*` are real WASM Component-Model guest crates (§5, task
# #10) -- deliberately their own separate cargo workspace, not members
# here. They target `wasm32-wasip1` and are built via `cargo component
# build`, an entirely different toolchain/output shape than every native
# crate in this workspace; folding them in here would make a plain `cargo
# build --workspace` try (and fail) to compile them for the host target.
exclude = ["crates/plugins"]
